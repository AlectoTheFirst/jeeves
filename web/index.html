<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeeves</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="scene" data-tauri-drag-region></canvas>
    <div id="requests"></div>
    <div id="transcript" aria-live="polite"></div>
    <div id="status">starting</div>
    <form id="panel" hidden>
      <label class="stack">project folder
        <span class="row"><input id="project" type="text" placeholder="~/code/my-project" spellcheck="false" /><button type="button" id="project-set">Set</button></span>
      </label>
      <textarea id="text" rows="3" placeholder="Type a request, or hold Space and speak."></textarea>
      <label>glitch <input id="glitch" type="range" min="0" max="100" value="50" /> <span id="glitch-value">50</span></label>
      <div class="row">
        <button type="submit">Ask</button>
        <button type="button" id="speak" class="dev-only">Speak</button>
        <button type="button" id="stop">Stop</button>
      </div>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
