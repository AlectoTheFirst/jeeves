<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeeves</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="scene" data-tauri-drag-region></canvas>
    <div id="transcript" aria-live="polite"></div>
    <div id="status">starting</div>
    <form id="dev-panel" hidden>
      <textarea id="dev-text" rows="3">Well hello there! I am your new desktop companion. Ask me anything about your code.</textarea>
      <label>glitch <input id="dev-glitch" type="range" min="0" max="100" value="50" /> <span id="dev-glitch-value">50</span></label>
      <div class="row">
        <button type="submit">Speak</button>
        <button type="button" id="dev-stop">Stop</button>
      </div>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
