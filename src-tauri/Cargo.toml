[package]
name = "jeeves"
version = "0.1.0"
edition = "2021"
description = "A desktop assistant with a 3D head that talks to a coding agent"
license = "MIT"
authors = ["Starkweb <126573706+AlectoTheFirst@users.noreply.github.com>"]

[lib]
name = "jeeves_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5.2"
sha2 = "0.11.1"
ed25519-dalek = "3.0.0"
